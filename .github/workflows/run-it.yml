name: Run it

# Runs every Java file changed in a pull request and prints what it outputs.
# Reviewers: open the Checks tab, click "Run it", then "Run the changed files", and read the output.
on: pull_request

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run the changed files
        run: |
          for f in $(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.java'); do
            echo "=== $f ==="
            java "$f"
          done
